# Production Compose: explicit service fields support deployment-platform rewrites.
# Domain rules and proxy networks are managed by the deployment platform.
---
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: statushub
      POSTGRES_DB: statushub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a URL-safe database password}"
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U statushub -d statushub
      interval: 5s
      timeout: 5s
      retries: 20
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command:
    - "--jetstream"
    - "--store_dir=/data"
    - "--http_port=8222"
    volumes:
    - nats-data:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: "${STATUSHUB_IMAGE:?Set a published GHCR image tag or digest}"
    pull_policy: always
    restart: 'no'
    init: true
    read_only: true
    tmpfs:
    - "/tmp:size=32m,mode=1777"
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - backend
    command:
    - statushub-migrate
    environment:
      DATABASE_URL: postgres://statushub:${POSTGRES_PASSWORD:?Set a URL-safe database
        password}@postgres:5432/statushub?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: "${STATUSHUB_IMAGE:?Set a published GHCR image tag or digest}"
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
    - "/tmp:size=32m,mode=1777"
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - backend
    command:
    - statushub-api
    environment:
      DATABASE_URL: postgres://statushub:${POSTGRES_PASSWORD:?Set a URL-safe database
        password}@postgres:5432/statushub?sslmode=disable
      NATS_URL: nats://nats:4222
      STATUSHUB_CONFIG_KEY: "${STATUSHUB_CONFIG_KEY:?Set a base64 32-byte key}"
      STATUSHUB_CONFIG_KEY_ID: "${STATUSHUB_CONFIG_KEY_ID:-production-v1}"
      STATUSHUB_REGION: "${STATUSHUB_REGION:-production}"
      STATUSHUB_API_ADDRESS: 0.0.0.0:8080
      STATUSHUB_API_KEY: "${STATUSHUB_API_KEY:?Set a separate base64 32-byte key}"
      STATUSHUB_PUBLIC_URL: "${STATUSHUB_PUBLIC_URL:?Set the public HTTPS URL}"
      STATUSHUB_TRUSTED_PROXIES: ${STATUSHUB_TRUSTED_PROXIES:-}
      STATUSHUB_SMTP_ADDRESS: "${STATUSHUB_SMTP_ADDRESS:?Set SMTP host and STARTTLS
        port}"
      STATUSHUB_SMTP_FROM: "${STATUSHUB_SMTP_FROM:?Set sender email}"
      STATUSHUB_SMTP_USERNAME: "${STATUSHUB_SMTP_USERNAME:-}"
      STATUSHUB_SMTP_PASSWORD: "${STATUSHUB_SMTP_PASSWORD:-}"
      STATUSHUB_SMTP_ALLOW_LOCAL_PLAINTEXT: 'false'
    expose:
    - '8080'
    ports:
    - "${STATUSHUB_BIND_ADDRESS:-127.0.0.1}:${STATUSHUB_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - "-fsS"
      - "--max-time"
      - '4'
      - http://127.0.0.1:8080/readyz
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    image: "${STATUSHUB_IMAGE:?Set a published GHCR image tag or digest}"
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
    - "/tmp:size=32m,mode=1777"
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - backend
    command:
    - statushubd
    - "-worker-id"
    - production-worker
    - "-metrics-address"
    - 0.0.0.0:9464
    environment:
      DATABASE_URL: postgres://statushub:${POSTGRES_PASSWORD:?Set a URL-safe database
        password}@postgres:5432/statushub?sslmode=disable
      NATS_URL: nats://nats:4222
      STATUSHUB_CONFIG_KEY: "${STATUSHUB_CONFIG_KEY:?Set a base64 32-byte key}"
      STATUSHUB_CONFIG_KEY_ID: "${STATUSHUB_CONFIG_KEY_ID:-production-v1}"
      STATUSHUB_REGION: "${STATUSHUB_REGION:-production}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
networks:
  backend:
volumes:
  postgres-data:
  nats-data:
