name: ci
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 scripts/check-compose.py
      - run: python3 scripts/check-public-docs.py
      - run: make ui-install ui-build
      - run: go vet ./...
      - run: go build ./...
