name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check public documentation
        run: python3 scripts/check-public-docs.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test console
        run: make ui-install ui-check
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Start integration dependencies
        run: docker compose -f deploy/compose.yaml up -d --wait
      - name: Verify migrations and crash/redelivery invariants
        run: make migrate-check test-integration
      - name: Stop integration dependencies
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
