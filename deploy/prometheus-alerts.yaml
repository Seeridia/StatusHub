groups:
  - name: statushub-m2
    rules:
      - alert: VendorStatusSourceFreshnessSLOBreach
        expr: histogram_quantile(0.95, sum by (le, engine) (rate(statushub_source_freshness_seconds_bucket[10m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vendor status source freshness p95 exceeds 30 seconds

      - alert: VendorStatusDeliveryFirstAttemptSLOBreach
        expr: histogram_quantile(0.95, sum by (le, channel) (rate(statushub_delivery_eligible_first_attempt_seconds_bucket[10m]))) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Eligible notification first-attempt p95 exceeds 5 seconds

      - alert: VendorStatusSchemaDriftDetected
        expr: increase(statushub_source_schema_drift_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A vendor status endpoint schema changed
